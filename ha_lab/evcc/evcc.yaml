# Minimal lab stub — replace meters/chargers for real hardware.
# Earnie mode: no surplus/smart-cost planner. See evcc.example.yaml.

network:
  schema: http
  host: evcc
  port: 7070

log: info

site:
  title: Earnie HA Lab
  meters:
    grid: grid
    pv: pv
    battery: battery

meters:
  - name: grid
    type: custom
    power:
      source: const
      value: 0
  - name: pv
    type: custom
    power:
      source: const
      value: 0
  - name: battery
    type: custom
    power:
      source: const
      value: 0
    soc:
      source: const
      value: 50

chargers:
  - name: wallbox
    type: custom
    status:
      source: const
      value: A
    enabled:
      source: const
      value: false
    enable:
      source: js
      script: ""
    maxcurrent:
      source: const
      value: 16
    maxcurrentout:
      source: js
      script: ""

loadpoints:
  - title: Lab
    charger: wallbox
    mode: now
