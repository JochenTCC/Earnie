# Minimal lab stub — replace meters/chargers for real hardware.
# Earnie mode: no surplus/smart-cost planner. See evcc.example.yaml.
#
# Charger: hand-rolled custom matching upstream demo-charger render.
# Do not use maxcurrentout or maxcurrent:source:const (FATAL on 0.207 decode).

network:
  schema: http
  host: evcc
  port: 7070

log: info

site:
  title: Earnie HA Lab
  meters:
    grid: grid
    pv: pv
    battery: battery

meters:
  - name: grid
    type: custom
    power:
      source: const
      value: 0
  - name: pv
    type: custom
    power:
      source: const
      value: 0
  - name: battery
    type: custom
    power:
      source: const
      value: 0
    soc:
      source: const
      value: 50

chargers:
  - name: wallbox
    type: custom
    status:
      source: const
      value: A
    enabled:
      source: const
      value: false
    enable:
      source: js
      script: |
        true
    maxcurrent:
      source: js
      script: |
        16
    power:
      source: const
      value: 0

loadpoints:
  - title: Lab
    charger: wallbox
    mode: now
