# Audience classification helpers for release notes and user docs.
# Spec: docs/spec/release-notes-workflow.md section 8. Rule: .cursor/rules/release-notes.mdc
#
# Backlog markers are authoritative: [feat] feature, [qual] quality/stability, [dev] internal.
# This file only PRE-CLASSIFIES unmarked material; the AI confirms with the maintainer.

# Commit subject prefixes (before the first colon) that are internal by default.
dev_prefixes = ["shadow", "spike", "research", "regression", "test", "chore", "skills", "releasenotes", "backlog", "contributing", "license"]

# Terms that must not appear in end-user docs or release notes ([dev] features).
dev_terms = ["Shadow Mode", "Shadow-Modus", "Shadow-Feed", "Shadow-Client", "Shadow-Banner", "EARNIE_SHADOW", "HouseSim"]

# End-user doc scope checked by tests/test_user_docs_audience.py.
user_doc_paths = ["docs/README.md", "docs/user-manual", "docs/einrichtung", "docs/konfiguration", "docs/ui", "docs/referenz", "README.md"]

# Known violations of dev_terms (ratchet, currently empty). Do not add entries; move content to docs/entwicklung/ or docs/spec/.
docs_allowlist = []

# BASELINE of internal backlog version IDs (2.7.n, 2.+1, ...) per user doc: counts may only shrink.
# Remove the ID from the doc, then lower/delete the entry (tests/test_user_docs_audience.py).
[backlog_id_baseline]
