# H2 / 2.6.k: smoke-test published app images under constrained QEMU CPUs.
# App image only here (add-on image is a thin wrapper FROM the same base).
# May be extended to earnie-addon-* tags once those exist on GHCR.
name: QEMU image smoke (H2)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Earnie image tag without leading v (must exist on GHCR)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Soft gate when called from release-publish (reusable caller cannot set continue-on-error).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            qemu_cpu: kvm64-v1
            platform: linux/amd64
          - arch: arm64
            qemu_cpu: cortex-a72
            platform: linux/arm64
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull and smoke (${{ matrix.arch }} / ${{ matrix.qemu_cpu }})
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/jochentcc/earnie-energy:${VERSION}"
          echo "Pulling ${IMAGE} for ${PLATFORM}…"
          docker pull --platform "$PLATFORM" "$IMAGE"
          # Constrain x86 guest CPU via QEMU_CPU when using qemu-user through Docker.
          # For amd64 on amd64 runners this is a native run; still validates imports.
          # For arm64 on amd64, Docker+QEMU emulates; OPENBLAS_NUM_THREADS=1 avoids hangs.
          docker run --rm --platform "$PLATFORM" \
            -e OPENBLAS_NUM_THREADS=1 \
            -e QEMU_CPU="${{ matrix.qemu_cpu }}" \
            "$IMAGE" \
            python -m scripts.qemu_image_smoke
