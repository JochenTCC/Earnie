# Earnie Home-Assistant-Add-on — Manifest (Supervisor).
# Entwicklungsquelle im Hauptrepo; Sync nach ha-addon-earnie bei Releases
# (siehe docs/einrichtung/homeassistant-addon.md und der Entwicklungsplan-Doku).
name: Earnie
version: "2.5.3"
slug: earnie
description: "Energiemanagement und Optimierung für Smart Homes. Nach dem Start ca. 20–40 s warten, bis die Web-UI (Ingress) bereit ist."
url: https://github.com/JochenTCC/Earnie
# Prebuilt per-arch images (H6); Supervisor pulls — no on-device apt build.
image: "ghcr.io/jochentcc/earnie-addon-{arch}"
# startup defaults to application (H7); omit for hassfest / addon-linter
init: false
panel_icon: mdi:solar-power
arch:
  - aarch64
  - amd64

# Grants SUPERVISOR_TOKEN + Core API via http://supervisor/core (SB self-discovery
# and EHAL-HA without a manual long-lived access token).
homeassistant_api: true
# Supervisor add-on API (mutual-exclusion with earnie_prerelease; network info later).
hassio_api: true

# Primary UI path: HA sidebar / OPEN WEB UI via Ingress (no host:8501 lookup).
# nginx listens on ingress_port 8501 and proxies to Streamlit on :8502 with
# baseUrlPath re-attached (HA strips the Ingress path before the add-on).
ingress: true
ingress_port: 8501

# Health: native Docker HEALTHCHECK in the image (addon-linter rejects obsolete
# config.yaml watchdog:). Streamlit on :8502; see docker/healthcheck.sh.

# Optional direct LAN ports (advanced). Same :8501 as Ingress (nginx).
# Container ports stay fixed; streamlit_port option is informational for the
# published UI port (Streamlit itself stays on internal 8502 behind nginx).
ports:
  8501/tcp: 8501
  8541/tcp: 8541
ports_description:
  8501/tcp: "Earnie Web-UI (optional direct; prefer Ingress)"
  8541/tcp: "EHAL Loxone-HTTP (optional, nur bei Loxone-Backend)"

# Config visible under /addon_configs/<hash>_earnie/ (Samba / File Editor).
# /data is always present for runtime; no explicit map entry needed.
map:
  - type: addon_config
    read_only: false

# Dateibasierte Konfiguration unter /config (config.json, Sidecars, .env).
# Die folgenden Optionen sind ein optionales Zusatzangebot; beim Start werden
# Port-Optionen in config.json gemerged und frische Installs bekommen
# ehal.backend=ha (siehe runtime_store/addon_options.py).
# Loxone-Zugangsdaten gehören in die In-App-Smarthome-Backend-Seite / config.json,
# nicht in die Supervisor-Optionen (Add-on impliziert HA als Backend).
options:
  streamlit_port: 8501
  ehal_loxone_http_port: 8541
  ui_modes: "sunset2sunset,scenario_explorer,live_environment"
  auto_start_main: true
  timezone: "Europe/Vienna"

schema:
  streamlit_port: "port?"
  ehal_loxone_http_port: "port?"
  ui_modes: "str?"
  auto_start_main: "bool?"
  timezone: "str?"
