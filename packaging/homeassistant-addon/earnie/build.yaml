# Arch -> Base-Image-Mapping für den HA-Add-on-Builder.
# Architektur-Entscheidung: Image-Wrapper (siehe Entwicklungsplan-Doku) —
# Dockerfile baut FROM ghcr.io/jochentcc/earnie-energy:${EARNIE_VERSION},
# kein eigener Alpine-/git-clone-Build. build_from bleibt für beide Archs
# gleich, da ghcr.io/jochentcc/earnie-energy bereits multi-arch (amd64/
# aarch64) veröffentlicht wird.
build_from:
  aarch64: ghcr.io/jochentcc/earnie-energy:2.5.1
  amd64: ghcr.io/jochentcc/earnie-energy:2.5.1

args:
  EARNIE_VERSION: "2.5.1"

labels:
  org.opencontainers.image.title: Earnie
  org.opencontainers.image.description: Energiemanagement und Optimierung für Smart Homes
  org.opencontainers.image.source: https://github.com/JochenTCC/Earnie
  org.opencontainers.image.licenses: siehe LICENSE.md
