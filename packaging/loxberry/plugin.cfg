# Earnie LoxBerry plugin — Scope A (thin Docker wrapper). Unix LF required.

[AUTHOR]
NAME=TechCreaCon
EMAIL=mail@techcreacon.com

[PLUGIN]
VERSION=0.1.0
NAME=earnie
FOLDER=earnie
TITLE=Earnie Energy
WEBSITE=https://github.com/JochenTCC/Earnie

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/JochenTCC/Earnie/main/packaging/loxberry/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/JochenTCC/Earnie/main/packaging/loxberry/prerelease.cfg

[SYSTEM]
REBOOT=false
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=aarch64
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
