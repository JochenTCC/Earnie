<script type="text/javascript">
(function () {
  var sel = document.getElementById("earnie_channel");
  var pin = document.getElementById("earnie_pinned_wrap");
  var auto = document.getElementById("earnie_auto_wrap");
  if (!sel) { return; }
  function sync() {
    var pinned = sel.value === "pinned";
    if (pin) { pin.style.display = pinned ? "" : "none"; }
    if (auto) { auto.style.display = pinned ? "none" : ""; }
  }
  sel.addEventListener("change", sync);
  sync();
})();
</script>
