sonar.organization=jochentcc
sonar.projectKey=JochenTCC_Earnie
sonar.python.version=3.11
sonar.sources=.
sonar.exclusions=**/tests/**,**/runtime_store/**,**/data/**,**/docs/**,**/.cursor/**,integrations/loxone_mcp_probe.py,integrations/loxone_mcp_transport.py,integrations/loxone_mcp_oauth.py
# Tier B: align with quality-gate packages + keep integrations measurable;
# exclude Streamlit UI, lab/packaging, root entrypoints/scratch, MCP helpers.
sonar.coverage.exclusions=\
  **/scripts/**,\
  **/ui/**,\
  **/house_sim/**,\
  **/tools/**,\
  **/poc_doc_assistant/**,\
  **/ha_lab/**,\
  **/openems_lab/**,\
  **/packaging/**,\
  **/greenfield/**,\
  **/deploy/**,\
  **/docker/**,\
  **/containers/**,\
  **/.devcontainer/**,\
  **/integrations/loxone_mcp_*.py,\
  app.py,\
  main.py,\
  config.py,\
  logger_config.py,\
  version.py,\
  modbus*.py,\
  testmodcom.py
sonar.python.coverage.reportPaths=coverage.xml

# Ignore intentional / non-agentic findings (also mirror under Project Administration →
# Analysis Scope → "Ignore Issues on Multiple Criteria" when possible).
# llm*: agentic-LLM CLI taint (local operator CLIs; not an LLM agent runtime).
# pip*: local `.` package / unlocked Actions install cannot use --only-binary=:all:.
# lock*: no poetry/uv lock by design (setuptools + requirements.txt → `.`).
# root*: container/HA add-on images run as root by design.
# http*: Loxone Miniserver LAN HTTP (no TLS on typical installs); lab mock REST;
#        generated Loxone/HA LAN templates, Earnie's own plain-HTTP UI/status on the LAN,
#        local smoke/capture tools.
sonar.issue.ignore.multicriteria=llm1,llm2,pip1,pip2,pip3,pip4,lock1,root1,http1,http2,http3,http4,http5,http6,http7,http8
sonar.issue.ignore.multicriteria.llm1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm1.resourceKey=**/*
