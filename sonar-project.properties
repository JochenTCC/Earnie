sonar.organization=jochentcc
sonar.projectKey=JochenTCC_Earnie
sonar.python.version=3.11
sonar.sources=.
sonar.exclusions=**/tests/**,**/runtime_store/**,**/data/**,**/docs/**,**/.cursor/**,integrations/loxone_mcp_probe.py,integrations/loxone_mcp_transport.py,integrations/loxone_mcp_oauth.py
sonar.coverage.exclusions=**/scripts/**,**/house_sim/ha_integration/**
sonar.python.coverage.reportPaths=coverage.xml

# Ignore intentional / non-agentic findings (also mirror under Project Administration →
# Analysis Scope → "Ignore Issues on Multiple Criteria" when possible).
# llm*: agentic-LLM CLI taint (local operator CLIs; not an LLM agent runtime).
# pip*: local `.` package / unlocked Actions install cannot use --only-binary=:all:.
# lock*: no poetry/uv lock by design (setuptools + requirements.txt → `.`).
# root*: container/HA add-on images run as root by design.
# http*: Loxone Miniserver LAN HTTP (no TLS on typical installs); lab mock REST.
sonar.issue.ignore.multicriteria=llm1,llm2,pip1,pip2,pip3,pip4,lock1,root1,http1,http2,http3
sonar.issue.ignore.multicriteria.llm1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm1.resourceKey=**/*
sonar.issue.ignore.multicriteria.llm2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.llm2.resourceKey=**/*
sonar.issue.ignore.multicriteria.pip1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.pip1.resourceKey=**/*
sonar.issue.ignore.multicriteria.pip2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.pip2.resourceKey=**/*
sonar.issue.ignore.multicriteria.pip3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.pip3.resourceKey=**/*
sonar.issue.ignore.multicriteria.pip4.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.pip4.resourceKey=**/*
sonar.issue.ignore.multicriteria.lock1.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lock1.resourceKey=**/pyproject.toml
sonar.issue.ignore.multicriteria.root1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.root1.resourceKey=**/*
sonar.issue.ignore.multicriteria.http1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.http1.resourceKey=**/integrations/loxone_*.py
sonar.issue.ignore.multicriteria.http2.ruleKey=python:S5332
