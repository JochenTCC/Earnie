sonar.organization=jochentcc
sonar.projectKey=JochenTCC_Earnie
sonar.python.version=3.11
sonar.sources=.
sonar.exclusions=**/tests/**,**/runtime_store/**,**/data/**,**/docs/**,**/.cursor/**,integrations/loxone_mcp_probe.py,integrations/loxone_mcp_transport.py,integrations/loxone_mcp_oauth.py
sonar.coverage.exclusions=**/scripts/**
sonar.python.coverage.reportPaths=coverage.xml

# Ignore agentic-LLM CLI taint rules (local operator CLIs; not an LLM agent runtime).
# Prefer also mirroring this under Project Administration → Analysis Scope →
# "Ignore Issues on Multiple Criteria" (SonarCloud multi-criteria is UI-canonical).
sonar.issue.ignore.multicriteria=llm1,llm2
sonar.issue.ignore.multicriteria.llm1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm1.resourceKey=**/*
sonar.issue.ignore.multicriteria.llm2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.llm2.resourceKey=**/*
