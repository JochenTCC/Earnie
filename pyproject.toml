[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnie"
description = "Energieoptimierung für Smarthome (Batterie, PV, flexible Verbraucher) mit Streamlit-UI"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "requests==2.31.0",
    "streamlit>=1.30.0",
    # Streamlit MediaAwareGZipResponder omits thread_minimum_size (required kw-only in Starlette 1.4+ → HTTP 500).
    "starlette>=0.46.0,<1.4",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "pulp>=2.8.0,<4",
    # Regression R0: pin so goldens stay comparable across dev / Docker / CI.
    "highspy==1.15.1",
    "python-dotenv>=1.0.0",
    "astral>=3.2",
    "jsonschema>=4.0.0",
    "cryptography>=42.0.0",
    "zeroconf>=0.130.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "vulture>=2.11",
    "pytest-deadfixtures>=2.2.1",
    # EarlyStart equivalence test: freezes the wall clock globally.
    "time-machine>=3.0",
    # Property-based storage roundtrip tests (tests/test_storage_roundtrip.py).
    "hypothesis>=6.100",
    # End-to-end UI smoke tests (tests/apptest/e2e); browser: `playwright install chromium`.
    "pytest-playwright>=0.5",
]
mutation = [
    "mutmut>=2.4.0,<3",
]

[project.scripts]
earnie-backtesting = "scripts.run_backtesting:main"
earnie-verify-loxone = "scripts.verify_loxone_setup:main"
earnie-bootstrap = "scripts.bootstrap_runtime:main"
earnie-validate-tariffs = "scripts.validate_tariffs:main"
earnie-build-image = "scripts.build_container:main"
earnie-generate-cons-data = "scripts.generate_cons_data:main"
ernie-backtesting = "scripts.run_backtesting:main"
ernie-verify-loxone = "scripts.verify_loxone_setup:main"
ernie-bootstrap = "scripts.bootstrap_runtime:main"
ernie-validate-tariffs = "scripts.validate_tariffs:main"
ernie-build-image = "scripts.build_container:main"
ernie-generate-cons-data = "scripts.generate_cons_data:main"

[tool.setuptools.dynamic]
version = { attr = "version.__version_pkg__" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "optimizer*",
    "data*",
    "integrations*",
    "runtime_store*",
    "ui*",
    "simulation*",
    "scripts*",
    "ehal*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Regression cases are auto-deselected in tests/conftest.py unless -m regression
# (or EARNIE_RUN_REGRESSION=1). Do not put -m "not regression" in addopts — that
# would AND with -m regression and select nothing.
markers = [
    "requires_loxone: Integrationstest gegen echten Loxone-Miniserver",
    "slow: Längerer Backtesting- oder MILP-Integrationslauf",
    "test_health_protected: Nie automatisch als Review-Kandidat markieren",
    "apptest: Streamlit-AppTest UI-Smoketest (rendert echte Seiten headless)",
    "ha_container: Needs a running HA testbed (scripts.ha_testbed); skipped unless HA_TESTBED_TOKEN is set, not part of the quality gate",
    "regression: Release golden-master suite (deselected by default; see docs/workflow/regression-suite.md)",
    "e2e: Playwright smoke tests against a real streamlit server (deselected by default; run with -m e2e, needs `playwright install chromium`)",
]

[tool.coverage.run]
source = ["optimizer", "data", "house_config", "simulation", "settings", "runtime_store", "ehal"]
omit = [
    "tests/*",
    "scripts/*",
    "**/house_sim/ha_integration/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
